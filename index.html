<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>NEU WebAR Check-in</title>
    <!-- A-Frame & MindAR bản nén nhanh -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <style>
      body { margin: 0; overflow: hidden; background: #000; }
      #capture-btn {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        width: 75px;
        height: 75px;
        background: #ffffff;
        border: 6px solid rgba(255, 255, 255, 0.7);
        border-radius: 50%;
        z-index: 10000;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      }
      #capture-btn:active {
        transform: translateX(-50%) scale(0.9);
      }
      #photo-modal {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85);
        z-index: 20000;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 20px;
      }
      #captured-img {
        max-width: 90%;
        max-height: 75%;
        border-radius: 12px;
      }
      #modal-note {
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 14px;
        margin-top: 15px;
        text-align: center;
      }
      #close-modal-btn {
        margin-top: 15px;
        padding: 10px 24px;
        background: #ffffff;
        color: #333;
        border: none;
        border-radius: 20px;
        font-weight: bold;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button id="capture-btn"></button>

    <div id="photo-modal">
      <img id="captured-img" src="" alt="Captured Image" />
      <div id="modal-note">💡 Nhấn giữ vào ảnh để chọn <b>"Lưu hình ảnh"</b></div>
      <button id="close-modal-btn">Chụp lại</button>
    </div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 10; warmupTolerance: 1; missTolerance: 3; uiLoading: no;"
      color-space="sRGB"
      renderer="colorManagement: true, preserveDrawingBuffer: true, antialias: false, powerPreference: high-performance"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets timeout="10000">
        <img id="charImg" src="./character.png" />
      </a-assets>

      <a-camera id="mainCamera" position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-image
          src="#charImg"
          position="0 0.1 0.2"
          scale="1.8 1.8 1.8"
          look-at="#mainCamera"
          transparent="true"
          animation="property: position; to: 0 0.25 0.2; dir: alternate; dur: 1200; loop: true; easing: easeInOutQuad;">
        </a-image>
      </a-entity>
    </a-scene>

    <script>
      const captureBtn = document.getElementById('capture-btn');
      const photoModal = document.getElementById('photo-modal');
      const capturedImg = document.getElementById('captured-img');
      const closeModalBtn = document.getElementById('close-modal-btn');

      closeModalBtn.addEventListener('click', () => {
        photoModal.style.display = 'none';
      });

      captureBtn.addEventListener('click', () => {
        const sceneEl = document.querySelector('a-scene');
        const video = document.querySelector('video');

        if (!video) return;

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || window.innerWidth;
        canvas.height = video.videoHeight || window.innerHeight;
        const ctx = canvas.getContext('2d');

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const webglCanvas = sceneEl.components.screenshot.getCanvas('perspective');
        if (webglCanvas) {
          ctx.drawImage(webglCanvas, 0, 0, canvas.width, canvas.height);
        }

        const dataURL = canvas.toDataURL('image/png');
        capturedImg.src = dataURL;
        photoModal.style.display = 'flex';
      });
    </script>
  </body>
</html>
