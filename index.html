<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>NEU WebAR Check-in</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
      #capture-btn {
        position: fixed;
        bottom: 35px;
        left: 50%;
        transform: translateX(-50%);
        width: 72px;
        height: 72px;
        background-color: #ffffff;
        border: 5px solid rgba(255, 255, 255, 0.6);
        border-radius: 50%;
        z-index: 9999;
        cursor: pointer;
        outline: none;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      }
      #capture-btn:active {
        transform: translateX(-50%) scale(0.9);
      }
    </style>
  </head>
  <body>
    <button id="capture-btn" title="Chụp ảnh"></button>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.001; filterBeta: 1000;"
      color-space="sRGB"
      renderer="colorManagement: true, preserveDrawingBuffer: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <img id="charImg" src="./character.png" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Đặt ảnh dựng đứng thẳng góc 0 0 0, scale vừa vặn và nhấp nhô lơ lửng mượt mà -->
        <a-image
          src="#charImg"
          position="0 0 0.15"
          scale="0.85 0.85 0.85"
          rotation="0 0 0"
          transparent="true"
          animation__hover="property: position; to: 0 0.1 0.15; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine;"
          animation__tilt="property: rotation; to: 0 0 5; dir: alternate; dur: 2200; loop: true; easing: easeInOutSine;">
        </a-image>
      </a-entity>
    </a-scene>

    <script>
      const captureBtn = document.getElementById('capture-btn');
      captureBtn.addEventListener('click', () => {
        const sceneEl = document.querySelector('a-scene');
        const video = document.querySelector('video');

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || window.innerWidth;
        canvas.height = video.videoHeight || window.innerHeight;
        const ctx = canvas.getContext('2d');

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const webglCanvas = sceneEl.components.screenshot.getCanvas('perspective');
        ctx.drawImage(webglCanvas, 0, 0, canvas.width, canvas.height);

        const dataURL = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = 'NEU-AR-Checkin.png';
        link.href = dataURL;
        link.click();
      });
    </script>
  </body>
</html>
